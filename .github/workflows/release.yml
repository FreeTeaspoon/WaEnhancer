name: Release

on:
  workflow_dispatch:
    inputs:
      draftRelease:
        description: Keep the release as a draft for installation checks
        type: boolean
        default: false

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Get version and SHA
        id: vars
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*versionName = "\([^ ]*\).*/\1/p')
          SHA8=$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHA8" >> $GITHUB_OUTPUT

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ -z "$KEY_STORE" ]; then
            echo "KEY_STORE is required for a release build"
            exit 1
          fi
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks

      - name: Apply pinned Miuix fixes
        run: ./scripts/apply-miuix-patches.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate both variants
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2 --continue
          -Pkotlin.compiler.execution.strategy=in-process
          testWhatsappDebugUnitTest testBusinessDebugUnitTest
          lintWhatsappDebug lintBusinessDebug
          assembleWhatsappDebug assembleBusinessDebug
          assembleWhatsappDebugAndroidTest assembleBusinessDebugAndroidTest

      - name: Upload validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics-${{ steps.vars.outputs.tag }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/intermediates/lint_intermediate_text_report/

      - name: Check patched Miuix formatting and regressions
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          :miuix:spotlessCheck :miuix:miuix-ui:spotlessCheck :miuix:miuix-nav:spotlessCheck
          :miuix:miuix-nav:desktopTest :miuix:miuix-ui:desktopTest

      - name: Build all release variants
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          assembleWhatsappRelease assembleBusinessRelease

      - name: Verify Xposed module metadata
        run: >-
          python3 scripts/verify-xposed-apk.py
          app/build/outputs/apk/whatsapp/debug/*.apk app/build/outputs/apk/business/debug/*.apk
          app/build/outputs/apk/whatsapp/release/*.apk app/build/outputs/apk/business/release/*.apk

      - name: Upload validation APKs and reports
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ steps.vars.outputs.tag }}
          retention-days: 7
          path: |
            app/build/outputs/apk/**/debug/*.apk
            app/build/outputs/apk/androidTest/**/*.apk
            app/build/test-results/
            app/build/reports/lint-results-*.html

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaEnhancer ${{ steps.vars.outputs.version }}
          draft: ${{ inputs.draftRelease }}
          body_path: changelog.txt
          files: |
            app/build/outputs/apk/whatsapp/release/WaEnhancer*.apk
            app/build/outputs/apk/business/release/WaEnhancer-Business*.apk
          tag_name: ${{ steps.vars.outputs.tag }}

      - name: Upload Proguard mappings
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mappings-${{ steps.vars.outputs.tag }}
          path: |
            app/build/outputs/mapping/whatsappRelease/mapping.txt
            app/build/outputs/mapping/businessRelease/mapping.txt

      - name: Read changelog
        id: changelog
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.txt', 'utf8').trim();
            core.setOutput('content', changelog);

      - name: Post to Telegram channel
        if: ${{ env.BOT_TOKEN != '' && !inputs.draftRelease }}
        uses: Dev4Mod/telegram-github-action@master
        with:
          to: ${{ env.CHANNEL_ID }}
          token: ${{ env.BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.changelog.outputs.content }}

            Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }}

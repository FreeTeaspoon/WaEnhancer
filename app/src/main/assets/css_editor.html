<!DOCTYPE html>
<html lang="en" data-theme="{{theme}}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { color-scheme: light; --editor-background: {{editorBackground}}; --editor-text: {{editorText}}; }
        :root[data-theme="dark"] { color-scheme: dark; }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body{
            height: 100vh;
            width: 100%;
            background: var(--editor-background);
            overflow: hidden;
        }
        label { display: none; }
        div.prism-live { position: fixed; inset: 0; width: 100%; height: 100vh; }
        textarea.prism-live, pre.prism-live { height: 100vh !important; margin: 0; }
        pre.prism-live { flex: none; }
    </style>
    <link href="www/prism.css" rel="stylesheet"/>
    <link href="www/prism-live.css" rel="stylesheet">
    <style>
        pre[class*="language-"], code[class*="language-"] { background: var(--editor-background) !important; color: var(--editor-text); text-shadow: none !important; }
        :root[data-theme="light"] .token { color: #385c90; }
        :root[data-theme="light"] .token.comment { color: #62676f; }
        :root[data-theme="light"] .token.punctuation { color: var(--editor-text); }
        :root[data-theme="light"] .token.property { color: #77530b; }
        :root[data-theme="light"] .token.selector { color: #80448a; }
        :root[data-theme="light"] .token.string { color: #276d43; }
        :root[data-theme="light"] .token.number { color: #99501c; }
        textarea.prism-live:not(.prism-live-source) {
            color: var(--editor-text);
            caret-color: var(--editor-text);
            font-family: monospace;
        }
    </style>
    <script src="www/prism.js"></script>
    <title>CSS Editor</title>
</head>
<body>
<label for="code"></label>
<textarea class="prism-live language-css fill" id="code" aria-label="{{editorLabel}}"
          style="--height: 100vh">{{content}}</textarea>
<script type="text/javascript">
    document.getElementById('code').addEventListener('input', function () {
        if (window.ManagerEditor) window.ManagerEditor.changed(this.value);
    });
    function getTextareaContent() {
           return document.getElementById('code').value;
       }
</script>
<script src="www/src/prism-live.mjs?load=css" type="module"></script>
</body>
</html>
